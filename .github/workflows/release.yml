name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, lint and test
        run: npm run check

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ARGS=(--title "$GITHUB_REF_NAME" --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          fi
          NOTES_FILE="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$NOTES_FILE" ]]; then
            RELEASE_ARGS+=(--notes-file "$NOTES_FILE")
          else
            RELEASE_ARGS+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "${RELEASE_ARGS[@]}" \
            main.js manifest.json styles.css THIRD_PARTY_NOTICES.md
